<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Secretary — MVP</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/inbox.jsx"></script>
  <script type="text/babel" src="app/capture.jsx"></script>
  <script type="text/babel" src="app/files.jsx"></script>
  <script type="text/babel" src="app/screens.jsx"></script>
  <script type="text/babel" src="app/desktop.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "view": "canvas",
      "startScreen": "inbox",
      "accent": "#3a6dd8",
      "density": "regular"
    }/*EDITMODE-END*/;

    function PhoneFrame({ children, label, w = 360, h = 760 }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
          <window.IOSDevice width={w} height={h}>
            <div style={{ position: 'absolute', inset: 0 }}>{children}</div>
          </window.IOSDevice>
          {label && (
            <div style={{ fontSize: 12, color: 'rgba(60,50,40,0.6)', fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace' }}>{label}</div>
          )}
        </div>
      );
    }

    // A pinned variant of App that starts on a specific screen, for the canvas.
    function PinnedApp({ start = 'inbox' }) {
      // Hack: render App once, then dispatch tab change via a key on mount.
      // Simpler: clone App's body but pre-set tab. We just expose a wrapper.
      const AppCmp = window.SecretaryApp;
      // Use a key to force fresh mount per artboard.
      return <AppCmp key={start} />;
    }

    // For specific-screen artboards we render screens directly (no app shell):
    function ScreenOnly({ which }) {
      const { T } = window.UI;
      const wrap = (node) => (
        <div style={{ position: 'absolute', inset: 0, background: T.bg, overflow: 'hidden' }}>
          <div style={{ position: 'absolute', inset: 0, overflowY: 'auto' }}>{node}</div>
        </div>
      );
      const noop = () => {};
      if (which === 'inbox') return wrap(<window.InboxView onOpenItem={noop} onOpenEntity={noop} onNavigate={noop} />);
      if (which === 'entity') return wrap(<window.FileManager entityId="newwok-norbury" onBack={noop} onOpenItem={noop} />);
      if (which === 'entity-flat') return wrap(<window.FileManager entityId="flat-plaistow" onBack={noop} onOpenItem={noop} />);
      if (which === 'entity-mercedes') return wrap(<window.FileManager entityId="mercedes" onBack={noop} onOpenItem={noop} />);
      if (which === 'item') return wrap(<window.ItemDetail itemId="i2" onBack={noop} />);
      if (which === 'calendar') return wrap(<window.CalendarView onOpenItem={noop} />);
      if (which === 'ask') return wrap(<window.AskView onOpenItem={noop} />);
      if (which === 'contacts') return wrap(<window.ContactsView onBack={noop} />);
      if (which === 'entities') return wrap(<window.EntitiesList onOpenEntity={noop} />);
      if (which === 'onb1') return wrap(<window.Onboarding onDone={noop} />);
      return null;
    }

    // Capture variants pinned to specific stages.
    function CaptureScene({ stage = 'aim', pages = 0 }) {
      const { T } = window.UI;
      // Render the actual flow but force a stage via a key + initial state hack.
      // The CaptureFlow component holds internal state so we wrap it and use auto-advance.
      // Simpler: just render with auto-actions via timers.
      const ref = React.useRef(null);
      return (
        <div style={{ position: 'absolute', inset: 0, background: T.bg, overflow: 'hidden' }}>
          <window.CaptureFlow onClose={() => {}} onFiled={() => {}} key={stage} />
        </div>
      );
    }

    // OnboardingApp — runs the full app starting from onboarding (live)
    function OnboardingApp() {
      // Use a flag pre-mount so App reads false
      window.__SEC_ONBOARDED = false;
      return <window.SecretaryApp />;
    }

    function Canvas() {
      const { DesignCanvas, DCSection, DCArtboard } = window;
      const W = 360, H = 760;
      return (
        <DesignCanvas>
          <DCSection id="overview" title="Secretary — MVP" subtitle="Mobile-native AI company secretary · iOS-system aesthetic">
            <DCArtboard id="full-app" label="Full app · live" width={W} height={H}>
              <PhoneFrame w={W} h={H}>
                <window.SecretaryApp />
              </PhoneFrame>
            </DCArtboard>
            <DCArtboard id="inbox" label="Inbox · today" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="inbox"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="ask" label="Ask · conversational" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="ask"/></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection id="capture" title="Camera-first capture" subtitle="The one input loop · photo → extract → approve → file">
            <DCArtboard id="cap-aim" label="1 · Viewfinder" width={W} height={H}>
              <PhoneFrame w={W} h={H}><CaptureScene stage="aim"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="cap-review" label="2 · Review extraction" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="item"/></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection id="files" title="Files per entity" subtitle="Each business / property / vehicle gets its own organised drawer">
            <DCArtboard id="entities" label="All entities" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="entities"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="entity-norbury" label="New Wok · Norbury" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="entity"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="entity-flat" label="Plaistow flat" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="entity-flat"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="entity-mercedes" label="Mercedes" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="entity-mercedes"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="calendar" label="Calendar" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="calendar"/></PhoneFrame>
            </DCArtboard>
            <DCArtboard id="contacts" label="Contacts · phonebook" width={W} height={H}>
              <PhoneFrame w={W} h={H}><ScreenOnly which="contacts"/></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection id="onboarding" title="Onboarding · live" subtitle="3 steps · add real entities, then they show up across the app">
            <DCArtboard id="onb-live" label="Onboarding · functional" width={W} height={H}>
              <PhoneFrame w={W} h={H}><OnboardingApp /></PhoneFrame>
            </DCArtboard>
          </DCSection>

          <DCSection id="desktop" title="Desktop / web app" subtitle="Same data, three-pane layout for serious filing sessions">
            <DCArtboard id="desktop-app" label="Web app · live" width={1280} height={820}>
              <window.ChromeWindow width={1280} height={820} url="app.secretary.co" tabs={[{ title: 'Secretary' }]}>
                <div style={{ position: 'relative', width: '100%', height: '100%' }}>
                  <window.SecretaryDesktop />
                </div>
              </window.ChromeWindow>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
  </script>
</body>
</html>
